name: Build Blink .ipa
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive
        run: |
          xcodebuild archive \
            -workspace Blink.xcworkspace \
            -scheme Blink \
            -configuration Release \
            -archivePath build/Blink.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/Blink.xcarchive/Products/Applications/Blink.app Payload/
          zip -r Blink.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-ipa
          path: Blink.ipa
